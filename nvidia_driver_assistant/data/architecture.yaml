# Unified Architecture Registry
#
# Single source of truth for every GPU architecture.  Each entry maps
# an architecture name to:
#   is_open_capable  – True if open kernel modules are supported
#   min_driver       – minimum NVIDIA driver branch (major version)
#   patterns         – regex patterns used by _get_architecture_from_device_name()
#                      to identify the architecture from a device name
#
# Derived constants (OPEN_CAPABLE_ARCHS, OPEN_UNSUPPORTED_ARCHS,
# ARCHITECTURE_MIN_DRIVER) are computed from this registry so that
# adding or changing an architecture only requires editing one place.

blackwell:
  # NVIDIA Blackwell architecture (RTX 50xx series, GB chips)
  is_open_capable: true
  min_driver: 550
  patterns:
    - '\bBLACKWELL\b'
    - '\bGB\d'
    - '\bRTX 50\d'
    - '\b5090\b'
    - '\b5080\b'
    - '\b5070\b'
    - '\b5060\b'
    - '\b5050\b'

ada:
  # NVIDIA Ada Lovelace architecture (RTX 40xx series, AD chips)
  is_open_capable: true
  min_driver: 525
  patterns:
    - '\bADA\b'
    - '\bAD\d|\bAD\b'
    - '\bRTX 40\d'
    - '\b4090\b'
    - '\b4080\b'
    - '\b4070\b'
    - '\b4060\b'
    - '\b4050\b'

ampere:
  # NVIDIA Ampere architecture (RTX 30xx series, GA chips)
  is_open_capable: true
  min_driver: 470
  patterns:
    - '\bAMPERE\b'
    - '\bGA\d|\bGA\b'
    - '\bRTX 30\d'
    - '\b3090\b'
    - '\b3080\b'
    - '\b3070\b'
    - '\b3060\b'
    - '\b3050\b'

turing:
  # NVIDIA Turing architecture (RTX 20xx, GTX 16xx series, TU chips)
  is_open_capable: true
  min_driver: 418
  patterns:
