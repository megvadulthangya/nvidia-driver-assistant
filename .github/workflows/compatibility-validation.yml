name: Compatibility Validation

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  compatibility-validation:
    name: Compatibility Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-yaml umockdev gir1.2-umockdev-1.0
          sudo apt-get install -y python3-aptdaemon python3-aptdaemon.test

      - name: Download and validate all NVIDIA supportedchips data
        run: |
          set -euo pipefail

          NVIDIA_INDEX_URL="https://download.nvidia.com/XFree86/Linux-x86_64/"
          NVIDIA_CHIPS_BASE="https://us.download.nvidia.com/XFree86/Linux-x86_64"

          echo "==> Fetching NVIDIA driver directory index..."
          INDEX_HTML="$(curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 10 "${NVIDIA_INDEX_URL}")"

          latest_nvidia_version() {
            local series="$1"
            local version_regex

            case "${series}" in
              6xx) version_regex='6[0-9]{2}\.[0-9]+(\.[0-9]+)?' ;;
              580|470|390|340) version_regex="${series}\.[0-9]+(\.[0-9]+)?" ;;
              *)
                echo "ERROR: Unsupported NVIDIA series: ${series}" >&2
                return 1
                ;;
            esac

            printf '%s\n' "${INDEX_HTML}" \
              | grep -oE "${version_regex}" \
              | sort -Vu \
              | tail -n1
          }

          download_supportedchips() {
            local series="$1"
            local filename="$2"
            local version="$3"

            if [[ -z "${version}" ]]; then
              echo "ERROR: Could not determine latest NVIDIA ${series} version" >&2
              return 1
            fi

            local url="${NVIDIA_CHIPS_BASE}/${version}/README/supportedchips.html"
            echo "==> NVIDIA ${series}: ${version}"
            echo "    ${url}"

            curl -fL --retry 5 --retry-delay 2 --connect-timeout 10 \
              -o "${DATA_DIR}/${filename}" "${url}"

            if [[ ! -s "${DATA_DIR}/${filename}" ]]; then
              echo "ERROR: NVIDIA ${series} document is empty" >&2
              return 1
            fi
          }

          DATA_DIR="nvidia_driver_assistant/data"
          mkdir -p "${DATA_DIR}"

          VERSION_6XX="$(latest_nvidia_version 6xx)" || true
          VERSION_580="$(latest_nvidia_version 580)" || true
          VERSION_470="$(latest_nvidia_version 470)" || true
          VERSION_390="$(latest_nvidia_version 390)" || true
          VERSION_340="$(latest_nvidia_version 340)" || true

          download_supportedchips 6xx supportedchips.html "${VERSION_6XX}"
          download_supportedchips 580 supportedchips580.html "${VERSION_580}"
          download_supportedchips 470 supportedchips470.html "${VERSION_470}"
          download_supportedchips 390 supportedchips390.html "${VERSION_390}"
          download_supportedchips 340 supportedchips340.html "${VERSION_340}"

          echo "==> Validating all five NVIDIA documents..."

          PYTHONPATH=. python3 - <<'PY'
          from nvidia_driver_assistant.supported_chips import (
              SUPPORTED_CHIPS,
              validate_all_documents,
          )

          supported = validate_all_documents()

          for branch in ("6xx", "580", "470", "390", "340"):
              print("Validated NVIDIA %s: %d device IDs" % (branch, len(supported[branch])))

          print(
              "RTX 4070 SUPER (2783) latest classification: %s"
              % SUPPORTED_CHIPS.get("2783")
          )
          PY

      - name: Run NVIDIA supportedchips parser tests
        run: |
          cd "$GITHUB_WORKSPACE"
          PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_supported_chips_parser.py' -v

      - name: Run original test suite
        run: |
          cd "$GITHUB_WORKSPACE"
          PYTHONPATH=. python3 tests/run --suite test_nvidia_driver_assistant.py

      - name: Run extended test suite (moretests)
        run: |
          cd "$GITHUB_WORKSPACE"
          PYTHONPATH=. python3 moretests/run --suite test_nvidia_driver_assistant.py

      ###################################################################
      #  COMPATIBILITY MATRIX (INFORMATIONAL ONLY – CANNOT FAIL)
      #
      #  WARNING: Enabling all 13 distros will produce ~3800 lines of
      #  output. For daily use, keep only a few distros uncommented
      #  below. You can temporarily enable others for release checks.
      ###################################################################
      - name: Full compatibility matrix (informational – never fails)
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE"

          # --- Supported distros (comment out those you don't need) ---
          DISTROS=(
            "fedora"
            "ubuntu:24.04"
            "manjaro"
            # "arch"               # ~3800 lines if all enabled
            # "debian"
            # "amzn:2023"
            # "mariner:2.0"
            # "kylin:V10"
            # "opensuse-leap:15.0"
            # "ol:9.5"
            # "rhel:7.5"
            # "rocky:8.6"
            # "sles:15"
          )

          SCENARIOS=(
            "545"
            "nvs290"
            "7150m"
            "740A"
            "750"
            "800A"
            "4070"
            "5070"
            "unknown"
            "mixed"
            "badmix"
          )

          for DISTRO in "${DISTROS[@]}"; do
            echo ""
            echo "============================================================"
            echo "  DISTRO: $DISTRO"
            echo "============================================================"

            for SCENARIO in "${SCENARIOS[@]}"; do
              case "$SCENARIO" in
                mixed)   FLAG="--simulate-mixed" ;;
                badmix)  FLAG="--simulate-badmix" ;;
                *)       FLAG="--simulate-gpu $SCENARIO" ;;
              esac

              echo ""
              echo "---- $DISTRO : $SCENARIO ----"
              PYTHONPATH=. ./nvidia-driver-assistant $FLAG --distro "$DISTRO" 2>&1 || true
              echo "---- end $SCENARIO ----"
            done
          done

          echo ""
          echo "Compatibility matrix completed (purely informational)."
