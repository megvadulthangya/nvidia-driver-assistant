name: Compatibility Validation

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-yaml umockdev gir1.2-umockdev-1.0
          sudo apt-get install -y python3-aptdaemon python3-aptdaemon.test

      - name: Run original test suite
        run: |
          cd $GITHUB_WORKSPACE
          PYTHONPATH=. python3 tests/run --suite test_nvidia_driver_assistant.py

      - name: Run extended test suite (moretests)
        run: |
          cd $GITHUB_WORKSPACE
          PYTHONPATH=. python3 moretests/run --suite test_nvidia_driver_assistant.py

      - name: Full compatibility matrix (informational – never fails)
        continue-on-error: true
        run: |
          cd $GITHUB_WORKSPACE

          DISTROS=(
            "fedora"
            "ubuntu:24.04"
            "debian"
            "manjaro"
            "arch"
            "amzn:2023"
            "mariner:2.0"
            "kylin:V10"
            "opensuse-leap:15.0"
            "ol:9.5"
            "rhel:7.5"
            "rocky:8.6"
            "sles:15"
          )

          SCENARIOS=(
            "545"
            "nvs290"
            "7150m"
            "740A"
            "750"
            "800A"
            "4070"
            "5070"
            "unknown"
            "mixed"
            "badmix"
          )

          for DISTRO in "${DISTROS[@]}"; do
            echo ""
            echo "============================================================"
            echo "  DISTRO: $DISTRO"
            echo "============================================================"
            for SCENARIO in "${SCENARIOS[@]}"; do
              case "$SCENARIO" in
                mixed)   FLAG="--simulate-mixed" ;;
                badmix)  FLAG="--simulate-badmix" ;;
                *)       FLAG="--simulate-gpu $SCENARIO" ;;
              esac

              echo -n "  • $SCENARIO ... "
              # Futtatjuk, de a kilépési kódot teljesen ignoráljuk
              OUTPUT=$(PYTHONPATH=. ./nvidia-driver-assistant $FLAG --distro "$DISTRO" 2>&1) || true
              # Rövid visszajelzés: az első sor, vagy "OK"/"UNSUPPORTED"
              FIRST_LINE=$(echo "$OUTPUT" | head -n 1)
              echo "$FIRST_LINE"
            done
          done

          echo ""
          echo "Compatibility matrix completed (purely informational)."
